# XcodeGen spec — run `xcodegen generate` in this directory to produce Keep.xcodeproj.
# (brew install xcodegen)
name: Keep
options:
  bundleIdPrefix: com.keeptxt
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.10"

targets:
  Keep:
    type: application
    platform: iOS
    sources:
      - Keep
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.keeptxt.keep
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: Keep/Info.plist
      properties:
        # Backend the app talks to. Defaults to production so the app works out
        # of the box (no local server). Flip to http://localhost:3000 for dev.
        KEEP_BASE_URL: "https://keeptxt.com"
        # Production is HTTPS and needs no exception; this only relaxes ATS for
        # local/.local addresses so switching KEEP_BASE_URL back to localhost works.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Without this declaration the system never hands the Spotlight-result
        # activity (CSSearchableItemActionType) to the SwiftUI scene, so tapping
        # a result opened the app but not the note.
        NSUserActivityTypes:
          - com.apple.corespotlightitem
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  KeepMac:
    type: application
    platform: macOS
    # Reuse the iOS target's model, services (API/auth/Spotlight), and title
    # logic plus the shared SignInView; only the Mac views + app entry are new.
    sources:
      - path: Keep/Models
      - path: Keep/Services
      - path: Keep/Support
      - path: Keep/Views/SignInView.swift
      - path: KeepMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.keeptxt.keep.mac
        # No App Sandbox for now: an ad-hoc/dev-signed sandboxed app doesn't
        # surface its Core Spotlight items reliably, and the sandbox container
        # adds nothing for a locally-run app. Unsandboxed, network + Spotlight
        # just work. Re-add the sandbox + entitlements for App Store distribution.
        # Hardened runtime is a distribution/notarization concern and only
        # complicates local signing — leave it off for now.
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: KeepMac/Info.plist
      properties:
        KEEP_BASE_URL: "https://keeptxt.com"
        LSMinimumSystemVersion: "14.0"
        # Register the keep:// scheme the Google sign-in bridge redirects to.
        CFBundleURLTypes:
          - CFBundleURLName: com.keeptxt.keep
            CFBundleURLSchemes:
              - keep
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSUserActivityTypes:
          - com.apple.corespotlightitem
