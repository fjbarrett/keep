# XcodeGen spec — run `xcodegen generate` in this directory to produce Keep.xcodeproj.
# (brew install xcodegen)
name: Keep
options:
  bundleIdPrefix: com.keeptxt
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.10"
    # Keep.xcodeproj is generated and gitignored, so a team picked in Xcode's
    # signing UI is lost on the next `xcodegen generate`. Set it here instead.
    DEVELOPMENT_TEAM: "FT8HJ5NF2H"

targets:
  KeepCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Keep/Models
      - Keep/Services
      - Keep/Support
      - Tests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO

  Keep:
    type: application
    platform: iOS
    sources:
      - Keep
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.keeptxt.keep
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Keep/Info.plist
      properties:
        # Backend the app talks to. Defaults to production so the app works out
        # of the box (no local server). Flip to http://localhost:3000 for dev.
        KEEP_BASE_URL: "https://keeptxt.com"
        # Production is HTTPS and needs no exception; this only relaxes ATS for
        # local/.local addresses so switching KEEP_BASE_URL back to localhost works.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Without this declaration the system never hands the Spotlight-result
        # activity (CSSearchableItemActionType) to the SwiftUI scene, so tapping
        # a result opened the app but not the note.
        NSUserActivityTypes:
          - com.apple.corespotlightitem
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  KeepMac:
    type: application
    platform: macOS
    # Reuse the iOS target's model, services (API/auth/Spotlight), title logic,
    # and the shared SignInView + markdown renderer; only the Mac views + app
    # entry are new.
    sources:
      - path: Keep/Models
      - path: Keep/Services
      - path: Keep/Support
      - path: Keep/Views/SignInView.swift
      - path: Keep/Views/MarkdownView.swift
      - path: Keep/Views/MarkdownImage.swift
      - path: Keep/Views/DraftSaveStatus.swift
      - path: Keep/Views/ReadingSettings.swift
      - path: KeepMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.keeptxt.keep.mac
        CODE_SIGN_ENTITLEMENTS: KeepMac/KeepMac.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: KeepMac/Info.plist
      properties:
        KEEP_BASE_URL: "https://keeptxt.com"
        LSMinimumSystemVersion: "14.0"
        # Register the keep:// scheme the Google sign-in bridge redirects to.
        CFBundleURLTypes:
          - CFBundleURLName: com.keeptxt.keep
            CFBundleURLSchemes:
              - keep
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSUserActivityTypes:
          - com.apple.corespotlightitem
