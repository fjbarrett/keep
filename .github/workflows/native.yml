name: Native

on:
  pull_request:
    paths: ["ios/**", ".github/workflows/native.yml"]
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/native.yml"]

permissions:
  contents: read

jobs:
  native:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: brew install xcodegen
      - run: xcodegen generate
        working-directory: ios
      - run: xcodebuild -project Keep.xcodeproj -scheme KeepCoreTests -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO test
        working-directory: ios
      - run: xcodebuild -project Keep.xcodeproj -scheme KeepMac -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build
        working-directory: ios
      - run: xcodebuild -project Keep.xcodeproj -scheme Keep -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
        working-directory: ios
