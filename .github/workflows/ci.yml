name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - name: Check release activation and rollback
        run: bash ops/tests/activate-release.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # npm 10's legacy audit request is retired by the registry. Keep the
      # package-manager version explicit so the security gate stays reliable.
      - run: npm install --global npm@11.6.0 --no-audit --no-fund
      - run: npm ci
      # Reuse Next's incremental build cache across runs so the gate build is warm.
      - name: Cache Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npx tsc --noEmit
      - run: npm test
      # Block on advisories that reach the server process. Build-only tooling
      # (tailwindcss 3's braces/micromatch chain) has advisories with no fixed
      # release, so the full-tree audit stays visible but cannot park deploys.
      - run: npm audit --omit=dev --audit-level=high
      - name: Audit all dependencies (advisory)
        run: npm audit --audit-level=high
        continue-on-error: true
      - run: npm run build

  # Auto-deploy from inside the private Proxmox network on every merge to main,
  # only after the hosted checks pass. The runner has one sudo capability: the
  # root-owned SSH wrapper in an isolated CI container. The production forced
  # command selects main and reruns its gates without accepting caller input.
  deploy:
    timeout-minutes: 25
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.KEEP_DEPLOY_ENABLED != 'false'
    runs-on: [self-hosted, linux, x64, keep-prod]
    environment:
      name: production
      url: https://keeptxt.com
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Deploy on Proxmox
        run: sudo -n /usr/local/sbin/deploy-keep

      - name: Smoke check
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL || 'https://keeptxt.com' }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$DEPLOY_URL" || echo 000)
          echo "GET $DEPLOY_URL -> $code"
          [ "$code" = "200" ]
