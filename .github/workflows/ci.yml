name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  # Auto-deploy to the production droplet on every merge to main, only after
  # checks pass. Mirrors scripts/deploy.sh. Host + key come from secrets so no
  # infra detail lives in this public repo; absent secrets => the job no-ops,
  # so the workflow is safe to merge before deploy is wired up.
  deploy:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://keeptxt.com
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/keep' }}
          DEPLOY_SERVICE: ${{ vars.DEPLOY_SERVICE || 'keep' }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "::notice::DEPLOY_HOST/DEPLOY_SSH_KEY not configured — skipping deploy."
            exit 0
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            "$DEPLOY_HOST" \
            "set -e
             cd '$DEPLOY_PATH'
             git fetch origin main -q && git reset --hard origin/main -q
             rm -rf .next
             npm ci --no-audit --no-fund
             npm run build
             systemctl restart '$DEPLOY_SERVICE'
             sleep 5
             echo \"service: \$(systemctl is-active '$DEPLOY_SERVICE') @ \$(git rev-parse --short HEAD)\""

      - name: Smoke check
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL || 'https://keeptxt.com' }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$DEPLOY_URL" || echo 000)
          echo "GET $DEPLOY_URL -> $code"
          [ "$code" = "200" ] || echo "::warning::smoke check returned $code"

  # Screenshot the iOS app on every merge to main, mirroring the web shot
  # (scripts/screenshot.sh). Needs a macOS runner for the iOS Simulator, so it's
  # gated behind the IOS_SCREENSHOT repo variable to avoid spending macOS minutes
  # until you opt in: `gh variable set IOS_SCREENSHOT --body true`. Archives every
  # shot under ios/screenshots/ and refreshes ios/docs/screenshot.png, committed
  # back to main.
  ios-screenshot:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.IOS_SCREENSHOT == 'true'
    runs-on: macos-15
    permissions:
      contents: write
    concurrency:
      group: ios-screenshot
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Capture screenshot
        run: scripts/ios-screenshot.sh
      - name: Commit screenshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ios/docs/screenshot.png ios/screenshots/
          if git diff --cached --quiet; then
            echo "::notice::iOS screenshot unchanged."
          else
            git commit -m "chore: refresh iOS screenshot [skip ci]"
            git push
          fi
