name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Reuse Next's incremental build cache across runs so the gate build is warm.
      - name: Cache Next.js build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run build

  # Auto-deploy to the production droplet on every merge to main, only after
  # checks pass. Mirrors scripts/deploy.sh. Host + key come from secrets so no
  # infra detail lives in this public repo; absent secrets => the job no-ops,
  # so the workflow is safe to merge before deploy is wired up.
  deploy:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://keeptxt.com
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/keep' }}
          DEPLOY_SERVICE: ${{ vars.DEPLOY_SERVICE || 'keep' }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "::notice::DEPLOY_HOST/DEPLOY_SSH_KEY/DEPLOY_KNOWN_HOSTS not configured — skipping deploy."
            exit 0
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "$DEPLOY_HOST" \
            "set -e
             cd '$DEPLOY_PATH'
             git fetch origin main -q && git reset --hard origin/main -q
             if [ ! -d node_modules ] || ! git diff --quiet ORIG_HEAD HEAD -- package-lock.json; then
               npm ci --no-audit --no-fund
             fi
             find .next -mindepth 1 -maxdepth 1 ! -name cache -exec rm -rf {} + 2>/dev/null || true
             npm run build
             systemctl restart '$DEPLOY_SERVICE'
             sleep 5
             echo \"service: \$(systemctl is-active '$DEPLOY_SERVICE') @ \$(git rev-parse --short HEAD)\""

      - name: Smoke check
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL || 'https://keeptxt.com' }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$DEPLOY_URL" || echo 000)
          echo "GET $DEPLOY_URL -> $code"
          [ "$code" = "200" ]

  # Refresh the desktop screenshot (docs/screenshot.png, shown in the README) on
  # every merge to main, after the deploy lands — the CI analog of the manual
  # scripts/deploy.sh -> scripts/screenshot.mjs flow. The script seeds guest data
  # and opens a code note, so the image shows the real populated UI rather than an
  # empty/sign-in screen. Chrome is preinstalled on the runner (screenshot.mjs
  # launches it via Playwright's `chrome` channel). Every shot is archived under
  # screenshots/keep-<ts>.png (committed alongside docs/screenshot.png) so the
  # design progression can be reviewed shot by shot over time.
  desktop-screenshot:
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: desktop-screenshot
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture screenshot
        env:
          KEEP_URL: ${{ vars.DEPLOY_URL || 'https://keeptxt.com' }}
        run: node scripts/screenshot.mjs
      - name: Commit screenshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Stage the README image first. If it's byte-identical to the last one,
          # the UI didn't change — skip the commit and let the fresh archive be
          # discarded. Otherwise it's a new version: keep its timestamped archive
          # too, so screenshots/ accumulates one frame per distinct design state.
          git add docs/screenshot.png
          if git diff --cached --quiet; then
            echo "::notice::Desktop screenshot unchanged — no new archive."
          else
            git add screenshots/
            git commit -m "chore: refresh desktop screenshot [skip ci]"
            # Concurrent runs (several merges in a row) can advance main between
            # our checkout and push. Retry: replay our commit onto the latest
            # main. The only file that can conflict is docs/screenshot.png (the
            # "latest" pointer) — keep our fresh capture; timestamped archives
            # have unique names and never collide. If we still lose the race
            # after retries, another run already refreshed the archive, so warn
            # instead of failing the build.
            pushed=false
            for attempt in 1 2 3 4 5; do
              if git push; then pushed=true; break; fi
              echo "push rejected (attempt $attempt) — rebasing onto origin/main"
              git fetch origin main
              if ! git rebase origin/main; then
                git checkout --theirs docs/screenshot.png || true
                git add docs/screenshot.png
                GIT_EDITOR=true git rebase --continue || git rebase --abort
              fi
            done
            if [ "$pushed" != true ]; then
              echo "::warning::screenshot archive not pushed; another run likely refreshed it"
            fi
          fi
