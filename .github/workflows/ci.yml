name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      # npm 10's legacy audit request is retired by the registry. Keep the
      # package-manager version explicit so the security gate stays reliable.
      - run: npm install --global npm@11.6.0 --no-audit --no-fund
      - run: npm ci
      # Reuse Next's incremental build cache across runs so the gate build is warm.
      - name: Cache Next.js build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run build

  # Auto-deploy from inside the private Proxmox network on every merge to main,
  # only after the hosted checks pass. The runner has one sudo capability: the
  # root-owned deployment script on the Keep container.
  deploy:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, keep-prod]
    environment:
      name: production
      url: https://keeptxt.com
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Deploy on Proxmox
        run: sudo -n /usr/local/sbin/deploy-keep

      - name: Smoke check
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL || 'https://keeptxt.com' }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$DEPLOY_URL" || echo 000)
          echo "GET $DEPLOY_URL -> $code"
          [ "$code" = "200" ]
