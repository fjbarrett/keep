name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Reuse Next's incremental build cache across runs so the gate build is warm.
      - name: Cache Next.js build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run build

  # Auto-deploy to the production droplet on every merge to main, only after
  # checks pass. Mirrors scripts/deploy.sh. Host + key come from secrets so no
  # infra detail lives in this public repo; absent secrets => the job no-ops,
  # so the workflow is safe to merge before deploy is wired up.
  deploy:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://keeptxt.com
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/keep' }}
          DEPLOY_SERVICE: ${{ vars.DEPLOY_SERVICE || 'keep' }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "::notice::DEPLOY_HOST/DEPLOY_SSH_KEY/DEPLOY_KNOWN_HOSTS not configured — skipping deploy."
            exit 0
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "$DEPLOY_HOST" \
            "set -e
             cd '$DEPLOY_PATH'
             git fetch origin main -q && git reset --hard origin/main -q
             if [ ! -d node_modules ] || ! git diff --quiet ORIG_HEAD HEAD -- package-lock.json; then
               npm ci --no-audit --no-fund
             fi
             find .next -mindepth 1 -maxdepth 1 ! -name cache -exec rm -rf {} + 2>/dev/null || true
             npm run build
             systemctl restart '$DEPLOY_SERVICE'
             sleep 5
             echo \"service: \$(systemctl is-active '$DEPLOY_SERVICE') @ \$(git rev-parse --short HEAD)\""

      - name: Smoke check
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL || 'https://keeptxt.com' }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$DEPLOY_URL" || echo 000)
          echo "GET $DEPLOY_URL -> $code"
          [ "$code" = "200" ]
